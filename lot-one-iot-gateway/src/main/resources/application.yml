server:
  port: 8084

spring:
  application:
    name: lot-one-iot-gateway
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: Aa123456
    druid:
      initial-size: 2
      max-active: 10
      min-idle: 2
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: iot-gateway-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      max-poll-records: 100
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

iot:
  gateway:
    tcp:
      port: 8083
    command:
      topic: device-command
      result-topic: device-command-result
      reply-timeout-seconds: 30

logging:
  level:
    com.lotone: debug
    org.springframework.kafka: info
