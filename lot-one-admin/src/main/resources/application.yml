server:
  port: 8081

spring:
  application:
    name: lot-one-admin
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lot?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: Aa123456
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
    mongodb:
      uri: mongodb://localhost:27017/lot
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: now()
      logic-not-delete-value: null

sa-token:
  token-name: token
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

jwt:
  signing-key: 6668f8be-87ec-450d-b3ee-0888f009b77e
  expires-time: 604800

knife4j:
  enable: true
  setting:
    language: zh_cn
